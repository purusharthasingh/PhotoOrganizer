# PhotoOrganizer configuration. Lives in the project; each scanned root keeps
# its own manifest in <root>/.photoorganizer/.

[library]
# Default root when a command is run without one.
root = "sample_photos"

[scan]
# Folders whose name only says what file format is inside. They are ignored when
# working out a capture's folder hint, so Trip/Raw/X.NEF and Trip/X.JPG are both in "Trip".
# Matching is case-insensitive.
format_subfolders = ["raw", "nef", "jpg", "jpeg"]

# Folder names never scanned (case-insensitive), at any depth.
skip_dirs = ["_quarantine", ".photoorganizer"]

# Warn about absolute paths longer than this (Windows MAX_PATH is 260).
path_warn_length = 240

# File extensions per kind (case-insensitive, with the dot).
[scan.extensions]
nef  = [".nef"]
jpg  = [".jpg", ".jpeg"]
heic = [".heic", ".heif"]
xmp  = [".xmp"]

[dedupe]
# Keeper rule 4: when exact copies tie on the earlier rules, prefer copies under
# these folders (relative to the scanned root), first match wins. Example:
# preferred_roots = ["Photos", "Imports"]
preferred_roots = []

[analysis]
# Previews are scaled so their long edge is at most this many pixels.
long_edge = 2048

# Stage 3 thresholds: starting points, to be calibrated in Milestone 2.
# Luminance Y is on 0-255; clip_hi = share of pixels >= 250, clip_lo = share <= 5.
[thresholds.exposure]
over_clip_hi    = 0.05   # overexposed: clip_hi above this ...
over_p50        = 170    # ... and median brighter than this
under_mean      = 50     # underexposed: mean below this and p99 below under_p99,
under_p99       = 180
under_clip_lo   = 0.30   # ... or more than this share of near-black pixels
extreme_clip_hi = 0.25   # extreme overexposure (auto-reject candidate in Milestone 5)

[thresholds.blur]
z         = -1.5         # flag when sharpness z-score (vs other frames) is below this
min_group = 3            # need at least this many frames to compare
min_p99   = 20           # near-black frames (p99 below this) get no blur verdict and are
                         # left out of the comparison, so they don't skew it
